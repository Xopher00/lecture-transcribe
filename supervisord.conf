[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:whisper-server]
command=/usr/local/bin/whisper-server -m /models/ggml-small.bin -t %(ENV_WHISPER_THREADS)s --host 127.0.0.1 --port 8090 --convert
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ollama]
command=/usr/bin/ollama serve
environment=OLLAMA_HOST="127.0.0.1:11434"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ollama-init]
command=/bin/sh -c "until curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1; do sleep 1; done; ollama pull ${CLEANUP_LLM_MODEL:-llama3.2:3b-instruct}"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=/opt/venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8080
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
